name: Quality checks

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'deploy/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run dependency-free checks
        run: npm run check
