name: Forge Quality

on:
  push:
    branches: [main, develop, "feat/**", "feature/**", "product/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install reproducibly
        run: npm ci
      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
      - name: Validate privacy and security contracts
        run: npm run validate
      - name: Test Forge lifecycle
        run: npm test
      - name: Build public site
        run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: crohnoz-forge-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
